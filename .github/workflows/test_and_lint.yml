# Node CI for the Next.js / Prisma stack (replaces the old Ruby on Rails job;
# this repository has no Ruby app).
#
# Integration tests (`npm run test:integration`) need a database and are
# deliberately left out of CI for now. The unit suite below needs none.
name: "CI"
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Harmless placeholder: prisma generate reads the variable but never connects.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6000

      - name: Unit tests
        run: npm test
